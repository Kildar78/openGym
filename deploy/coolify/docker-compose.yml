# openGym pour Coolify (build pack « Docker Compose »), avec les images précompilées.
#
# Différences avec le docker-compose.yml de la racine :
#  - pas de « ports: » : c'est le Traefik de Coolify qui expose le service web sur le domaine ;
#  - pas de « env_file: .env » : les variables se règlent dans l'onglet Environment Variables ;
#  - pas de « build: » : rien à compiler sur le VPS, les mises à jour sont un simple Redeploy ;
#  - volumes nommés : les données survivent aux redéploiements et sont sauvegardables par Coolify.
#
# Dans Coolify, sur le service « web », mettre le domaine : https://<ton-sous-domaine>
# (le conteneur écoute sur le port 8080, Coolify le détecte via SERVICE_FQDN_WEB_8080 ci-dessous).

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api@sha256:397c83e9ac33a413bc8f21e66b2e55038100fc7f9da900d80be28b30fbb12ea8
    restart: unless-stopped
    environment:
      # Obligatoires. Les passkeys sont liées pour toujours à RP_ID : à fixer avant le premier profil.
      - RP_ID=${RP_ID:?Mettre RP_ID, le nom de domaine seul, par ex. gym.example.com}
      - ORIGIN=${ORIGIN:?Mettre ORIGIN, par ex. https://gym.example.com}
      - RP_NAME=${RP_NAME:-openGym}
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
      # Le premier profil créé devient admin.
      - FIRST_USER_ADMIN=${FIRST_USER_ADMIN:-1}
      - SESSION_DAYS=${SESSION_DAYS:-30}
      - DEFAULT_LANG=${DEFAULT_LANG:-fr}
      # Instance privée, verrouillée par défaut : inscription sur code d'invitation seulement
      # (codes créés par l'admin), pas de « Continuer sans compte », pas de tokens d'API.
      # ATTENTION : sur une instance VIDE, INVITE_ONLY=1 empêche aussi le premier profil.
      # Pour l'installer : mettre INVITE_ONLY=0 dans Coolify, créer son profil, retirer la variable.
      - INVITE_ONLY=${INVITE_ONLY:-1}
      - ALLOW_GUEST=${ALLOW_GUEST:-0}
      - API_TOKENS=${API_TOKENS:-off}
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    volumes:
      # Profils, passkeys, séances, clé de session, médias : C'EST CE QU'IL FAUT SAUVEGARDER.
      - opengym-data:/data
      - opengym-coach-auth:/coach-auth

  web:
    image: ghcr.io/duartesantos8/opengym-web@sha256:e621677554302a0e1745e3b8c90acddc7d7149e118c4d683d51c13aa88f47d27
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Dit à Coolify que le service public est celui-ci, sur le port 8080 du conteneur.
      # 8080 et pas 80 : l'image déclare EXPOSE 8080, et Coolify n'écrit pas toujours
      # l'étiquette de port Traefik, qui vise alors ce port exposé (sinon : 502 Bad Gateway).
      - SERVICE_FQDN_WEB_8080
      - NGINX_PORT=8080
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      - BASE_PATH=
      - MEDIA_UPLOAD_MAX=112m
      - MCP_BACKEND=mcp
      - MCP_PORT=3100

volumes:
  opengym-data:
  opengym-coach-auth:
