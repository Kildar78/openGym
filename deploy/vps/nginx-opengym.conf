# Option 2 : nginx déjà installé sur le VPS, certificat via certbot.
#
#   sudo cp nginx-opengym.conf /etc/nginx/sites-available/opengym.conf
#   (remplacez gym.example.com par votre domaine)
#   sudo ln -s /etc/nginx/sites-available/opengym.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gym.example.com
#
# certbot ajoute lui-même le bloc HTTPS (listen 443 ssl, certificats) et la redirection HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name gym.example.com;

    # Synchronisation de tout l'historique en un seul PUT, et vidéos d'exercices.
    client_max_body_size 112m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Un envoi de vidéo lent ou une requête du Coach IA peut durer plusieurs minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
